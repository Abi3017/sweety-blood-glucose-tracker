name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sweety
          POSTGRES_PASSWORD: sweety
          POSTGRES_DB: sweety_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sweety"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Create test env file
        run: |
          cat > .env.test <<'ENV'
          DATABASE_URL="postgresql://sweety:sweety@localhost:5432/sweety_test?schema=public"
          JWT_SECRET="ci-only-test-secret-0123456789abcdef0123456789"
          JWT_EXPIRES_IN="1h"
          CLIENT_URL="http://localhost:5173"
          NODE_ENV="test"
          APP_TIMEZONE="Asia/Kolkata"
          ENV
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
