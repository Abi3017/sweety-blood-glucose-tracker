# Render Blueprint: PostgreSQL + API (Docker) + static frontend.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
#
# The frontend forwards /api/* to the API, so the browser only talks to one origin and the
# auth cookie stays first-party (the API uses SameSite=Strict cookies).
#
# The two public URLs below assume the service names are free on Render. If Render gives
# you different hostnames (e.g. sweety-web-x1y2.onrender.com), update CLIENT_URL on the
# API service and the /api rewrite destination on the frontend, then redeploy.

databases:
  - name: sweety-db
    plan: free
    databaseName: sweety
    user: sweety

services:
  - type: web
    name: sweety-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sweety-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      # Must equal the public URL of the frontend (CORS + CSRF origin check).
      - key: CLIENT_URL
        value: https://sweety-web.onrender.com

  - type: web
    name: sweety-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Same-origin API proxy.
      - type: rewrite
        source: /api/*
        destination: https://sweety-api.onrender.com/api/*
      # Client-side routing.
      - type: rewrite
        source: /*
        destination: /index.html
